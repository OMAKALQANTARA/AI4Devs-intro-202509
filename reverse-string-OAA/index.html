<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .result-container {
            min-height: 50px;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 0.75rem;
            background-color: #f8f9fa;
        }
        .copy-btn {
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <!-- Title -->
                        <h1 class="card-title text-center mb-4 text-primary">
                            <i class="bi bi-arrow-left-right me-2"></i>Reverse String
                        </h1>
                        
                        <!-- Input Section -->
                        <div class="mb-4">
                            <label for="textInput" class="form-label fw-semibold">Enter text to reverse:</label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="textInput" 
                                   placeholder="Type your text here..."
                                   autocomplete="off">
                        </div>
                        
                        <!-- Reverse Button -->
                        <div class="d-grid mb-4" id="reverseBtnContainer" style="display: none;">
                            <button type="button" 
                                    class="btn btn-primary btn-lg" 
                                    id="reverseBtn">
                                Reverse <i class="bi bi-arrow-left-right ms-2"></i>
                            </button>
                        </div>
                        
                        <!-- Result Display -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Reversed Result:</label>
                            <div class="result-container" id="resultContainer">
                                <span class="text-muted">Your reversed text will appear here...</span>
                            </div>
                        </div>
                        
                        <!-- Copy Button -->
                        <div class="d-grid mb-4">
                            <button type="button" 
                                    class="btn btn-outline-secondary btn-lg copy-btn" 
                                    id="copyBtn" 
                                    disabled>
                                Copy Result <i class="bi bi-clipboard ms-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
